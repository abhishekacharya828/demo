// STAGE 9 — Generate CNES Reports
//           MANUAL → selected services
//           CRON   → all services
// ================================================================
stage('Generate CNES Reports') {
    agent { label 'LI_192.168.14.49' }

    steps {
        script {

            def selectedServices = env.SVC?.trim() ? env.SVC.trim().split(/\s+/) : []

            if (selectedServices.length == 0) {
                error "No services selected for CNES report generation."
            }

            def projects = selectedServices.collect { svc ->
                "AS_${svc.replace('_', '-')}"
            }

            echo "============================================"
            echo "CNES Report Generation"
            echo "============================================"
            echo "Selected services: ${env.SVC}"
            echo "CNES projects: ${projects.join(' ')}"
            echo "============================================"

            sh """
                set -e

                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                export PATH=\$JAVA_HOME/bin:\$PATH

                BASE=/home/apmosys/sonar-reports
                mkdir -p "\${BASE}"

                PROJECTS="${projects.join(' ')}"

                for PROJECT in \$PROJECTS; do

                    echo "======================================"
                    echo "Generating CNES report for \$PROJECT"
                    echo "======================================"

                    mkdir -p "\${BASE}/\${PROJECT}"

                    java -jar /home/apmosys/sonarqube/plugins/sonar-cnes-report-4.2.0.jar \\
                        -s http://192.168.14.49:9001 \\
                        -t "\${SONAR_USER_TOKEN}" \\
                        -p "\${PROJECT}" \\
                        -o "\${BASE}/\${PROJECT}"

                    echo "Saved: \${BASE}/\${PROJECT}"
                done

                echo "======================================"
                echo "Zipping CNES reports"
                echo "======================================"

                cd "\${BASE}"

                rm -f sonar-cnes-report-all.zip

                zip -r sonar-cnes-report-all.zip \$PROJECTS

                ls -lh "\${BASE}/sonar-cnes-report-all.zip"

                cp "\${BASE}/sonar-cnes-report-all.zip" \
                    "\${WORKSPACE}/sonar-cnes-report-all.zip"
            """
        }
    }
}
        // ================================================================
        // STAGE 10 — Parse CNES Reports  (CRON only)
        // ================================================================
        // ================================================================
// STAGE 10 — Parse CNES Reports
// ================================================================
stage('Parse CNES Reports') {
    agent { label 'LI_192.168.14.49' }

    steps {
        script {

            def selectedServices = env.SVC?.trim()
                ? env.SVC.trim().split(/\s+/)
                : []

            def projects = selectedServices.collect { svc ->
                "AS_${svc.replace('_', '-')}"
            }

            echo "============================================"
            echo "Parsing CNES Reports"
            echo "============================================"
            echo "Projects: ${projects.join(' ')}"
            echo "============================================"

            sh """
                set -e

                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                export PATH=\$JAVA_HOME/bin:\$PATH

                BASE=/home/apmosys/sonar-reports

                python3 /home/apmosys/scripts/parse_cnes_summary.py \\
                    --base "\${BASE}" \\
                    --projects ${projects.join(' ')} \\
                    --output "\${WORKSPACE}/cnes_summary.json"

                echo "======================================"
                echo "Summary JSON"
                echo "======================================"

                cat "\${WORKSPACE}/cnes_summary.json"
            """

            stash includes: 'cnes_summary.json', name: 'cnes-summary'

            echo '✅ CNES metrics parsed and stashed.'
        }
    }
}

        // ================================================================
        // STAGE 11 — Send Code Quality Email  (CRON only)
        // ================================================================
        stage('Send Email') {
            // when { expression { return env.IS_CRON == 'true' } }
            agent { label 'LI_192.168.14.49' }
            steps {
                // unstash 'sbom-zip'
                unstash 'cnes-summary'

                sh '''
                    ls -lh "${WORKSPACE}/sonar-cnes-report-all.zip"
                    ls -lh "${WORKSPACE}/cnes_summary.json"
                '''
                    // ls -lh "${WORKSPACE}/sbom-reports-all.zip"

                script {
                    def summary = readJSON(file: "${WORKSPACE}/cnes_summary.json")

                    def totalBugs = 0; def totalVulns = 0; def totalSmells = 0
                    def totalBlocker = 0; def totalCritical = 0; def totalMajor = 0; def totalIssues = 0

                    summary.each { proj, d ->
                        totalBugs     += (d.bugs            ?: 0)
                        totalVulns    += (d.vulnerabilities ?: 0)
                        totalSmells   += (d.code_smells     ?: 0)
                        totalBlocker  += (d.blocker         ?: 0)
                        totalCritical += (d.critical        ?: 0)
                        totalMajor    += (d.major           ?: 0)
                        totalIssues   += (d.total_issues    ?: 0)
                    }

                    def healthBadge = totalBlocker  > 0 ? '🔴 ACTION REQUIRED' :
                                      totalCritical > 0 ? '🟠 REVIEW NEEDED'   : '🟢 ALL CLEAR'
                    def healthColor = totalBlocker  > 0 ? '#B91C1C' : totalCritical > 0 ? '#C2410C' : '#15803D'
                    def healthBg    = totalBlocker  > 0 ? '#FEE2E2' : totalCritical > 0 ? '#FFEDD5' : '#DCFCE7'

                    def tableRows = ''; def rowIndex = 0
                    summary.each { project, d ->
                        def shortName = project.replace('AS_', '').split('-').collect { it.capitalize() }.join(' ')
                        def bugs = d.bugs ?: 0; def vulns = d.vulnerabilities ?: 0; def smells = d.code_smells ?: 0
                        def blocker = d.blocker ?: 0; def critical = d.critical ?: 0; def major = d.major ?: 0
                        def minor = d.minor ?: 0; def info = d.info ?: 0; def total = d.total_issues ?: 0
                        def date = d.report_date ?: 'N/A'; def hasErr = d.error ? ' ⚠' : ''
                        def rowBg = rowIndex % 2 == 0 ? '#FFFFFF' : '#F8FAFC'
                        def bugClr = bugs > 0 ? '#B91C1C' : '#15803D'
                        def vulnClr = vulns > 0 ? '#B91C1C' : '#15803D'
                        def blockerClr = blocker > 0 ? '#B91C1C' : '#6B7280'
                        def criticalClr = critical > 0 ? '#C2410C' : '#6B7280'
                        def gateIcon = (blocker > 0 || bugs > 0 || vulns > 0) ? '🔴' : (critical > 0 || major > 0) ? '🟠' : '🟢'
                        rowIndex++
                        tableRows += """
                        <tr style="background:${rowBg};">
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;font-weight:500;color:#1E293B;white-space:nowrap;">${gateIcon} ${shortName}${hasErr}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${bugClr};font-weight:600;">${bugs}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${vulnClr};font-weight:600;">${vulns}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#7C3AED;">${smells}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${blockerClr};font-weight:${blocker > 0 ? '700' : '400'};">${blocker}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${criticalClr};font-weight:${critical > 0 ? '700' : '400'};">${critical}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#92400E;">${major}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#374151;">${minor}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#6B7280;">${info}</td>
                            <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;font-weight:700;color:#0F172A;">${total}</td>
