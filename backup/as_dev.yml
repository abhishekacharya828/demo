            steps {
                sh """#!/bin/bash
                    set -e
                    SBOM_DIR=/home/apmosys/sbom-scanner
                    mkdir -p \${SBOM_DIR}

                    declare -A JAR_MAP
                    JAR_MAP[api-testing-service]=api-testing-service.jar
