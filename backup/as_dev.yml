        stage('Backup Existing JARs') {
            steps {
                script {
                    def services = env.SVC.trim().split(/\s+/)
                    for (svc in services) {
                        sh """
                            set -e
                            APP_DIR=/home/apmosys/cliQTest_AS
                            BACKUP_DIR=/home/apmosys/backeup
                            TIME=\$(date +%Y%m%d_%H%M%S)
                            mkdir -p \$BACKUP_DIR

                            case "${svc}" in
                                api_testing_service)      SRC=\$APP_DIR/apitesting_service/api-testing-service.jar;           BACKUP_NAME=api-testing-service.jar ;;
                                cloud_gateway_service)    SRC=\$APP_DIR/cloud_gateway_service/cloud-gateway-service.jar;       BACKUP_NAME=cloud-gateway-service.jar ;;
                                custom_function_service)  SRC=\$APP_DIR/custom_function_service/custom-function-service.jar;   BACKUP_NAME=custom-function-service.jar ;;
                                project_creation_service) SRC=\$APP_DIR/project_creation_service/project-creation-service.jar; BACKUP_NAME=project-creation-service.jar ;;
                                project_execute_service)  SRC=\$APP_DIR/project_execution_service/project-execution-service.jar; BACKUP_NAME=project-execution-service.jar ;;
                                scheduler_service)        SRC=\$APP_DIR/scheduler_service/scheduler-service.jar;               BACKUP_NAME=scheduler-service.jar ;;
                                service_registry)         SRC=\$APP_DIR/service_registry/service-registry.jar;                BACKUP_NAME=service-registry.jar ;;
                                user_service)             SRC=\$APP_DIR/user_service/user-service.jar;                        BACKUP_NAME=user-service.jar ;;
                            esac

                            if [ -f "\$SRC" ]; then
                                cp "\$SRC" "\$BACKUP_DIR/\${BACKUP_NAME}_\$TIME"
                                ls -1t \$BACKUP_DIR/\${BACKUP_NAME}_* | tail -n +3 | xargs -r rm -f
                                echo "✅ Backup completed: ${svc}"
                            else
                                echo "⚠️ JAR not found: \$SRC"
                            fi
                        """
                    }
                }
            }
        }

        // ================================================================
        // STAGE 13 — Copy JARs to CliQTest_AS  (always runs)
        // ================================================================
        stage('Copy JARs To CliQTest_AS') {
            steps {
                script {
                    def services = env.SVC.trim().split(/\s+/)
                    for (svc in services) {
                        sh """
                            set -e
                            SOURCE=/home/apmosys/sbom-scanner
                            TARGET=/home/apmosys/cliQTest_AS

                            case "${svc}" in
                                api_testing_service)      cp \$SOURCE/api-testing-service.jar      \$TARGET/apitesting_service/ ;;
                                cloud_gateway_service)    cp \$SOURCE/cloud-gateway-service.jar    \$TARGET/cloud_gateway_service/ ;;
                                custom_function_service)  cp \$SOURCE/custom-function-service.jar  \$TARGET/custom_function_service/ ;;
                                project_creation_service) cp \$SOURCE/project-creation-service.jar \$TARGET/project_creation_service/ ;;
                                project_execute_service)  cp \$SOURCE/project-execution-service.jar \$TARGET/project_execution_service/ ;;
                                scheduler_service)        cp \$SOURCE/scheduler-service.jar        \$TARGET/scheduler_service/ ;;
                                service_registry)         cp \$SOURCE/service-registry.jar         \$TARGET/service_registry/ ;;
                                user_service)             cp \$SOURCE/user-service.jar             \$TARGET/user_service/ ;;
                            esac

                            echo "✅ Copied: ${svc}"
                        """
                    }
                }
            }
        }

        // ================================================================
        // STAGE 14 — Docker Build & Restart  (always runs)
        // ================================================================
        stage('Docker Build & Restart Services') {
    steps {
        script {

            // Jenkins selection key → actual Docker Compose service name
            def dockerServiceMap = [
                api_testing_service      : 'apitesting_service',
                cloud_gateway_service    : 'cloud_gateway_service',
                custom_function_service  : 'custom_function_service',
                project_creation_service : 'project_creation_service',
                project_execute_service  : 'project_execution_service',
                scheduler_service        : 'scheduler_service',
                service_registry         : 'service_registry',
                user_service             : 'user_service'
            ]

            def selectedServices = env.SVC.trim().split(/\s+/)

            def dockerServices = selectedServices.collect { svcKey ->

                def dockerService = dockerServiceMap[svcKey]

                if (!dockerService) {
                    error "No Docker Compose mapping found for: ${svcKey}"
                }

                return dockerService
            }.join(' ')

            echo "===================================="
            echo "Jenkins Selected Services"
            echo "===================================="
            echo "${env.SVC}"

            echo "===================================="
            echo "Docker Compose Services"
            echo "===================================="
            echo "${dockerServices}"

            sh """
                set -e

                cd /home/apmosys/cliQTest_AS

                echo "===================================="
                echo "--- Docker Build ---"
                echo "===================================="

                docker compose build ${dockerServices}

                echo "===================================="
                echo "--- Container Restart ---"
                echo "===================================="

                docker compose up -d --force-recreate ${dockerServices}

                echo "===================================="
                echo "--- Status ---"
                echo "===================================="

                docker compose ps

                echo "===================================="
                echo "--- Pruning unused images ---"
                echo "===================================="

                docker image prune -f

                echo "✅ Docker deployment complete."
            """
        }
    }
}

