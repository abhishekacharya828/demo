                    JAR_MAP[dashboard-service]=dashboard-service.jar
                    JAR_MAP[project-creation-service]=project-creation-service.jar
                    JAR_MAP[project-execute-service]=project-execution-service.jar
                    JAR_MAP[report-service]=report-service.jar
                    JAR_MAP[scheduler-service]=scheduler-service.jar
                    JAR_MAP[service-registry]=service-registry.jar
                    JAR_MAP[user-service]=user-service.jar

                    for SVC in "\${!JAR_MAP[@]}"; do
                        JAR_NAME=\${JAR_MAP[\$SVC]}
                        SRC=${BACKEND_DIR}/\${SVC}/target/\${JAR_NAME}
                        if [ -f "\${SRC}" ]; then
                            cp "\${SRC}" "\${SBOM_DIR}/\${JAR_NAME}"
                            echo "✅ Copied: \${JAR_NAME}"
                        else
                            echo "❌ NOT FOUND: \${SRC}"
                        fi
                    done

                    echo "--- JARs in \${SBOM_DIR} ---"
                    ls -lh \${SBOM_DIR}/*.jar
                """
            }
        }

