                        </td>

                        <td style="padding:9px 10px;border-bottom:1px solid #E2E8F0;text-align:center;color:#7C3AED;font-weight:700;">
                            ${cvss}
                        </td>

                        <td style="padding:9px 10px;border-bottom:1px solid #E2E8F0;color:#64748B;font-size:10px;">
                            ${service}
                        </td>

                    </tr>
