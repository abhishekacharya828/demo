pipeline {
    agent { label 'AS_DEV_1_252' }
    environment {
        GITLAB_USER      = 'biswajita'
        GITLAB_TOKEN     = "<token>"
        BACKEND_REPO     = "http://${GITLAB_USER}:${GITLAB_TOKEN}@192.168.12.135:8085/products-and-rnd/cliqtest/as"
        JAVA_HOME        = '/usr/lib/jvm/java-21-openjdk-amd64'
        PATH             = "${JAVA_HOME}/bin:${env.PATH}"
        SONAR_HOST       = 'http://192.168.14.49:9001'
        SONAR_USER_TOKEN = 'squ_cf9d9f5bd0cc69ead02ac1508f5082c3ec64ae2c'
        // MAIL_TO          = 'prabhat.padhy@ap2l.ai, savita.patil@ap2l.ai, gopal.pradhan@ap2l.ai, kadira.maruf@ap2l.ai, biswajita.panigrahi@ap2l.ai,satyajit.sahoo@ap2l.ai,ankit.jaiswal.ap2l.ai,abhishek.acharya@ap2l.ai'
        WORKSPACE_DIR    = '/home/apmosys/newbuild/as-CliqTest_AS_original'
        BACKEND_DIR      = "${WORKSPACE_DIR}/AS_backend/AS_backend"
        FRONTEND_DIR     = "${WORKSPACE_DIR}/AS_backend/AS_frontend"
        MAIL_TO          = 'abhishekacharya828@gmail.com, abhishek.acharya@ap2l.ai'
        
        SBOM_URL         = 'http://192.168.12.125:8081'
        USER_EMAIL       = 'jenkins@ap2l.ai'
        USER_PASS        = 'Apmosys@123'
        USER_ID          = '10'
        PROJECT_ID       = '95'

        FRONTEND_DIST    = "${WORKSPACE_DIR}/AS_backend/AS_frontend/dist/ngasa-proj/browser"
        GATEWAY_DIR      = "${WORKSPACE_DIR}/AS_backend/AS_backend/cloud-gateway-service"
        GATEWAY_STATIC   = "${GATEWAY_DIR}/src/main/resources/static"
    }

    stages {

        // ================================================================
        // STAGE 1 — Detect trigger type + select services
        // CRON   → env.IS_CRON=true  , all services auto-selected
        // MANUAL → env.IS_CRON=false , user picks services via checkbox UI
        // ================================================================
        stage('Select Services To Deploy') {
            steps {
                script {
                    def causes = currentBuild.getBuildCauses()
                    def isCron = causes.any { it._class.contains('TimerTriggerCause') }
                    env.IS_CRON = isCron.toString()

                    // Maps deploy-key (underscored, used for env.SVC / docker-compose
                    // service names) → Maven module directory name (hyphenated)
                    def dirMap = [
                        api_testing_service     : 'api-testing-service',
                        cloud_gateway_service   : 'cloud-gateway-service',
                        custom_function_service : 'custom-function-service',
                        project_creation_service: 'project-creation-service',
                        project_execute_service : 'project-execute-service',
                        scheduler_service       : 'scheduler-service',
                        service_registry        : 'service-registry',
                        user_service            : 'user-service'
                    ]

                    if (isCron) {
                        echo "===================================="
                        echo "CRON TRIGGER DETECTED"
                        echo "FULL PIPELINE: BUILD ALL + SCAN + DEPLOY ALL"
                        echo "===================================="

                        env.SVC            = dirMap.keySet().join(' ')
                        // cloud-gateway-service is built separately (bundled with
                        // the Angular frontend), so exclude it from the plain Maven loop
                        env.BUILD_SERVICES = dirMap.findAll { k, v -> k != 'cloud_gateway_service' }.values().join(' ')
                        env.DEPLOY_GATEWAY = 'true'

                    } else {
                        echo "===================================="
                        echo "MANUAL TRIGGER DETECTED"
                        echo "PIPELINE: BUILD ONLY SELECTED SVC(S) + DEPLOY"
                        echo "SONAR / SBOM / CNES / MAIL → SKIPPED"
                        echo "===================================="

                        def services = input(
                            message: 'Select service(s) to deploy',
                            parameters: [
                                booleanParam(name: 'api_testing_service',      defaultValue: false),
                                booleanParam(name: 'cloud_gateway_service',    defaultValue: false),
                                booleanParam(name: 'custom_function_service',  defaultValue: false),
                                booleanParam(name: 'project_creation_service', defaultValue: false),
                                booleanParam(name: 'project_execute_service',  defaultValue: false),
                                booleanParam(name: 'scheduler_service',        defaultValue: false),
                                booleanParam(name: 'service_registry',         defaultValue: false),
                                booleanParam(name: 'user_service',             defaultValue: false)
                            ]
                        )

                        def selectedKeys = services.findAll { it.value }.keySet()

                        if (!selectedKeys) {
                            error "No service selected. Aborting."
                        }

                        env.SVC = selectedKeys.join(' ')

                        // cloud-gateway-service has its own dedicated build stage
                        // (Angular + gateway JAR), so it's excluded from the plain
                        // Maven loop and instead gated via DEPLOY_GATEWAY
                        env.BUILD_SERVICES = selectedKeys.findAll { it != 'cloud_gateway_service' }
                                                          .collect { dirMap[it] }
                                                          .join(' ')
                        env.DEPLOY_GATEWAY = selectedKeys.contains('cloud_gateway_service').toString()
                    }

                    echo "===================================="
                    echo "TRIGGER         : ${isCron ? 'CRON (build all + scan + deploy all)' : 'MANUAL (build selected + deploy selected)'}"
                    echo "DEPLOY SVC      : ${env.SVC}"
                    echo "MAVEN BUILD SVC : ${env.BUILD_SERVICES}"
                    echo "BUILD GATEWAY   : ${env.DEPLOY_GATEWAY}"
                    echo "===================================="
                }
            }
        }

        // ================================================================
        // STAGE 2 — Git Checkout  (always runs)
        // ================================================================
        stage('Git Checkout') {
            steps {
                dir("${WORKSPACE_DIR}/AS_backend") {
                    git branch: 'CliqTest_AS_original', url: "${BACKEND_REPO}"
                }
            }
        }

        // ================================================================
        // STAGE 3 — Maven Build  (always runs)
        //           CRON   → builds ALL 8 services
        //           MANUAL → builds ONLY the selected service(s)
        //           Sequential one-by-one to avoid resource exhaustion.
        // ================================================================
        stage('Maven Build (Selected/All Services)') {
            steps {
                sh """
                    export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                    export PATH=\$JAVA_HOME/bin:\$PATH

                    echo "Java version: \$(java -version 2>&1)"
                    echo "Services to build: ${env.BUILD_SERVICES}"

                    for SVC in ${env.BUILD_SERVICES}; do
                        echo "============================================"
                        echo "Maven Build: \$SVC"
                        echo "============================================"

                        cd ${BACKEND_DIR}/\$SVC

                        JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 \
                        PATH=/usr/lib/jvm/java-21-openjdk-amd64/bin:\$PATH \
                        ./mvnw clean package -DskipTests \
                            -Dmaven.repo.local=/home/apmosys/.m2/repository

                        echo "✅ Build done: \$SVC"
                        echo ""
                    done

                    echo "Maven build(s) completed."
                """
            }
        }

// ================================================================
// STAGE 4 — Sonar Scan
//           CRON   → scans all services
//           MANUAL → scans only selected services
//           Uses Maven Sonar plugin — no SonarScanner required
// ================================================================
stage('Sonar Scan (Selected Services)') {
    steps {
        script {

            def sonarServices = [
                api_testing_service      : 'api-testing-service',
                cloud_gateway_service    : 'cloud-gateway-service',
                custom_function_service  : 'custom-function-service',
                project_creation_service : 'project-creation-service',
                project_execute_service  : 'project-execute-service',
                scheduler_service        : 'scheduler-service',
                service_registry         : 'service-registry',
                user_service             : 'user-service'
            ]

            def selectedServices = env.SVC.split()

            echo "============================================"
            echo "Sonar Scan - Selected Services"
            echo "============================================"
            echo "Selected services: ${env.SVC}"
            echo "============================================"

            selectedServices.each { svcKey ->

                def svc = sonarServices[svcKey]

                if (!svc) {
                    echo "⚠️ Unknown service: ${svcKey}"
                    return
                }

                echo ""
                echo "============================================"
                echo "Sonar Scan: ${svc}"
                echo "============================================"

                sh """
                    export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                    export PATH="\$JAVA_HOME/bin:\$PATH"

                    cd "${BACKEND_DIR}/${svc}"

                    echo "Running SonarQube analysis for ${svc}..."

                    ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
                         -Dsonar.projectKey=AS_${svc} \
                         -Dsonar.projectName=AS_${svc} \
                         -Dsonar.host.url="${SONAR_HOST}" \
                         -Dsonar.login="${SONAR_USER_TOKEN}"

                    echo "✅ Sonar scan done: ${svc}"
                """
            }

            echo ""
            echo "============================================"
            echo "All selected Sonar scans completed."
            echo "============================================"
        }
    }
}

        // ================================================================
        // STAGE 5 — Angular Build + Copy to Gateway + Gateway JAR
        //           (always runs — needed for deploy in both modes)
        // ================================================================
        stage('Build Frontend in Docker + Build Gateway') {
    when {
        expression { env.DEPLOY_GATEWAY == 'true' }
    }

    steps {
        sh """
        set -e

        export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
        export PATH=\$JAVA_HOME/bin:\$PATH

        echo "======================================"
        echo "Building Angular inside Docker"
        echo "======================================"

        cd ${FRONTEND_DIR}

        docker build -t angular-builder:latest -f Dockerfile .

        docker rm -f angular-builder >/dev/null 2>&1 || true

        docker run -d --name angular-builder angular-builder:latest

        echo "======================================"
        echo "Copy browser build to Gateway"
        echo "======================================"

        rm -rf "${GATEWAY_STATIC}"
        mkdir -p "${GATEWAY_STATIC}"

        docker cp \
            angular-builder:/app/dist/ngasa-proj/browser/. \
            "${GATEWAY_STATIC}/"

        docker rm -f angular-builder

        echo "======================================"
        echo "Building cloud-gateway-service"
        echo "======================================"

        cd ${GATEWAY_DIR}

        ./mvnw clean package \
            -DskipTests \
            -Dmaven.repo.local=/home/apmosys/.m2/repository

        echo "Gateway build completed."
        """
    }
}

  
        // ================================================================
// STAGE — Syft + Grype Security Scan
//
// IMPORTANT:
// JAR NEVER LEAVES THIS JENKINS SERVER.
//
// Syft and Grype are installed directly on 252.
//
// JAR
//  ↓
// Syft → CycloneDX SBOM
//  ↓
// Grype → Vulnerability JSON
//  ↓
// HTML Security Report
// ================================================================

stage('Syft + Grype Security Scan') {

    steps {

        script {

            def securityServices = [
                api_testing_service      : 'api-testing-service',
                cloud_gateway_service    : 'cloud-gateway-service',
                custom_function_service  : 'custom-function-service',
                project_creation_service : 'project-creation-service',
                project_execute_service  : 'project-execute-service',
                scheduler_service        : 'scheduler-service',
                service_registry         : 'service-registry',
                user_service             : 'user-service'
            ]

            def selectedServices =
                env.SVC.trim().split(/\s+/)

            sh '''
                set -e

                SECURITY_DIR="${WORKSPACE}/security-reports"

                rm -rf "${SECURITY_DIR}"

                mkdir -p "${SECURITY_DIR}"

                echo "============================================"
                echo "DevSecOps Security Scanner"
                echo "============================================"

                echo "Syft:"
                syft version

                echo ""
                echo "Grype:"
                grype version

                echo ""
                echo "Security report directory:"
                echo "${SECURITY_DIR}"

                echo "============================================"
            '''

            selectedServices.each { svcKey ->

                def svc =
                    securityServices[svcKey]

                if (!svc) {

                    error(
                        "No security mapping found for ${svcKey}"
                    )
                }


                def jarName

                if (svc == 'project-execute-service') {

                    jarName =
                        'project-execution-service.jar'

                } else {

                    jarName =
                        "${svc}.jar"
                }


                def jarPath =
                    "${BACKEND_DIR}/${svc}/target/${jarName}"


                def serviceReportDir =
                    "${WORKSPACE}/security-reports/${svc}"


                echo ""
                echo "============================================"
                echo "Security Scan: ${svc}"
                echo "============================================"

                sh """
                    set -e

                    mkdir -p "${serviceReportDir}"

                    if [ ! -f "${jarPath}" ]; then

                        echo "ERROR: JAR not found:"
                        echo "${jarPath}"

                        exit 1

                    fi

                    echo ""
                    echo "JAR:"
                    ls -lh "${jarPath}"

                    echo ""
                    echo "--------------------------------------------"
                    echo "SYFT - Generating CycloneDX SBOM"
                    echo "--------------------------------------------"

                    syft \\
                        "${jarPath}" \\
                        -o cyclonedx-json \\
                        > "${serviceReportDir}/${svc}-sbom.json"

                    echo ""
                    echo "SBOM generated:"
                    ls -lh "${serviceReportDir}/${svc}-sbom.json"


                    echo ""
                    echo "--------------------------------------------"
                    echo "GRYPE - Vulnerability Scan"
                    echo "--------------------------------------------"

                    grype \\
                        "sbom:${serviceReportDir}/${svc}-sbom.json" \\
                        -o json \\
                        > "${serviceReportDir}/${svc}-grype.json"

                    echo ""
                    echo "Grype report generated:"
                    ls -lh "${serviceReportDir}/${svc}-grype.json"


                    echo ""
                    echo "--------------------------------------------"
                    echo "Generating Human Readable HTML Report"
                    echo "--------------------------------------------"

                    SCAN_SERVICE="${svc}" \\
                    SCAN_JAR="${jarPath}" \\
                    SBOM_FILE="${serviceReportDir}/${svc}-sbom.json" \\
                    GRYPE_FILE="${serviceReportDir}/${svc}-grype.json" \\
                    HTML_FILE="${serviceReportDir}/${svc}-security-report.html" \\
                    BUILD_NUMBER="${BUILD_NUMBER}" \\
                    python3 /home/apmosys/devsecops-reports/generate-html-report.py


                    echo ""
                    echo "Security scan completed:"
                    echo "${svc}"

                """
            }


            // ====================================================
            // CREATE ONE ZIP FOR ALL SECURITY REPORTS
            // ====================================================

            sh '''
                set -e

                cd "${WORKSPACE}/security-reports"

                echo ""
                echo "============================================"
                echo "Creating Security Reports Archive"
                echo "============================================"

                rm -f "${WORKSPACE}/security-reports-all.zip"

                zip -r \
                    "${WORKSPACE}/security-reports-all.zip" \
                    .

                echo ""
                echo "Security archive:"
                ls -lh "${WORKSPACE}/security-reports-all.zip"

                echo ""
                echo "Security scan completed successfully."
            '''

        }
    }
}
stage('Generate CNES Reports') {
    agent { label 'LI_192.168.14.49' }

    steps {
        script {

            def selectedServices = env.SVC?.trim() ? env.SVC.trim().split(/\s+/) : []

            if (selectedServices.length == 0) {
                error "No services selected for CNES report generation."
            }

            def projects = selectedServices.collect { svc ->
                "AS_${svc.replace('_', '-')}"
            }

            echo "============================================"
            echo "CNES Report Generation"
            echo "============================================"
            echo "Selected services: ${env.SVC}"
            echo "CNES projects: ${projects.join(' ')}"
            echo "============================================"

            sh """
                set -e

                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                export PATH=\$JAVA_HOME/bin:\$PATH

                BASE=/home/apmosys/sonar-reports
                mkdir -p "\${BASE}"

                PROJECTS="${projects.join(' ')}"

                for PROJECT in \$PROJECTS; do

                    echo "======================================"
                    echo "Generating CNES report for \$PROJECT"
                    echo "======================================"

                    mkdir -p "\${BASE}/\${PROJECT}"

                    java -jar /home/apmosys/sonarqube/plugins/sonar-cnes-report-4.2.0.jar \\
                        -s http://192.168.14.49:9001 \\
                        -t "\${SONAR_USER_TOKEN}" \\
                        -p "\${PROJECT}" \\
                        -o "\${BASE}/\${PROJECT}"

                    echo "Saved: \${BASE}/\${PROJECT}"
                done

                echo "======================================"
                echo "Zipping CNES reports"
                echo "======================================"

                cd "\${BASE}"

                rm -f sonar-cnes-report-all.zip

                zip -r sonar-cnes-report-all.zip \$PROJECTS

                ls -lh "\${BASE}/sonar-cnes-report-all.zip"

                cp "\${BASE}/sonar-cnes-report-all.zip" \
                    "\${WORKSPACE}/sonar-cnes-report-all.zip"
            """
        }
    }
}
        // ================================================================
        // STAGE 10 — Parse CNES Reports  (CRON only)
        // ================================================================
        // ================================================================
// STAGE 10 — Parse CNES Reports
//           MANUAL + CRON
// ================================================================
stage('Parse CNES Reports') {
    agent { label 'LI_192.168.14.49' }

    steps {
        script {

            def selectedServices = env.SVC?.trim()
                ? env.SVC.trim().split(/\s+/)
                : []

            def projects = selectedServices.collect { svc ->
                "AS_${svc.replace('_', '-')}"
            }

            echo "============================================"
            echo "Parsing CNES Reports"
            echo "============================================"
            echo "Projects: ${projects.join(' ')}"
            echo "============================================"

            sh """
                set -e

                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
                export PATH=\$JAVA_HOME/bin:\$PATH

                BASE=/home/apmosys/sonar-reports

                python3 /home/apmosys/scripts/parse_cnes_summary.py \\
                    --base "\${BASE}" \\
                    --projects ${projects.join(' ')} \\
                    --output "\${WORKSPACE}/cnes_summary.json"

                echo "======================================"
                echo "Summary JSON"
                echo "======================================"

                cat "\${WORKSPACE}/cnes_summary.json"
            """

            stash includes: 'cnes_summary.json', name: 'cnes-summary'

            echo '✅ CNES metrics parsed and stashed.'
        }
    }
}

        // ================================================================
       // ================================================================
// STAGE 11 — Send Combined SonarQube + Syft + Grype Email
// ================================================================
stage('Send Email') {

    agent { label 'LI_192.168.14.49' }

    steps {

        // ------------------------------------------------------------
        // Restore reports generated on AS_DEV_1_252
        // ------------------------------------------------------------
        unstash 'cnes-summary'
        unstash 'security-summary'
        unstash 'security-reports'

        sh '''
            echo "===== Email Reports ====="

            echo "--- CNES ---"
            ls -lh "${WORKSPACE}/sonar-cnes-report-all.zip" || true
            ls -lh "${WORKSPACE}/cnes_summary.json" || true

            echo "--- Security ---"
            ls -lh "${WORKSPACE}/security-summary.json" || true
            ls -lh "${WORKSPACE}/security-reports-all.zip" || true

            echo "========================="
        '''

        script {

            // ========================================================
            // SONARQUBE / CNES SUMMARY
            // ========================================================

            def summary = readJSON(
                file: "${WORKSPACE}/cnes_summary.json"
            )

            def totalBugs       = 0
            def totalVulns      = 0
            def totalSmells     = 0
            def totalBlocker    = 0
            def totalCritical   = 0
            def totalMajor      = 0
            def totalMinor      = 0
            def totalInfo       = 0
            def totalIssues     = 0

            summary.each { proj, d ->

                totalBugs      += (d.bugs             ?: 0) as Integer
                totalVulns     += (d.vulnerabilities ?: 0) as Integer
                totalSmells    += (d.code_smells      ?: 0) as Integer
                totalBlocker   += (d.blocker          ?: 0) as Integer
                totalCritical  += (d.critical         ?: 0) as Integer
                totalMajor     += (d.major            ?: 0) as Integer
                totalMinor     += (d.minor            ?: 0) as Integer
                totalInfo      += (d.info             ?: 0) as Integer
                totalIssues    += (d.total_issues     ?: 0) as Integer
            }


            // ========================================================
            // SYFT + GRYPE SECURITY SUMMARY
            // ========================================================

            def securitySummary = readJSON(
                file: "${WORKSPACE}/security-summary.json"
            )

            def totalSecurityCritical = 0
            def totalSecurityHigh     = 0
            def totalSecurityMedium   = 0
            def totalSecurityLow      = 0
            def totalSecurityNegligible = 0
            def totalSecurityUnknown  = 0
            def totalSecurity         = 0
            def totalComponents      = 0

            securitySummary.each { service, d ->

                totalSecurityCritical += (d.critical   ?: 0) as Integer
                totalSecurityHigh     += (d.high       ?: 0) as Integer
                totalSecurityMedium   += (d.medium     ?: 0) as Integer
                totalSecurityLow      += (d.low        ?: 0) as Integer
                totalSecurityNegligible += (d.negligible ?: 0) as Integer
                totalSecurityUnknown  += (d.unknown    ?: 0) as Integer
                totalSecurity         += (d.total      ?: 0) as Integer
                totalComponents       += (d.components ?: 0) as Integer
            }


            // ========================================================
            // OVERALL HEALTH
            // ========================================================

            def healthBadge
            def healthColor
            def healthBg

            if (totalBlocker > 0 || totalSecurityCritical > 0) {

                healthBadge = '🔴 ACTION REQUIRED'
                healthColor = '#B91C1C'
                healthBg    = '#FEE2E2'

            } else if (
                totalCritical > 0 ||
                totalSecurityHigh > 0
            ) {

                healthBadge = '🟠 REVIEW NEEDED'
                healthColor = '#C2410C'
                healthBg    = '#FFEDD5'

            } else {

                healthBadge = '🟢 ALL CLEAR'
                healthColor = '#15803D'
                healthBg    = '#DCFCE7'
            }


            // ========================================================
            // SONAR PER-SERVICE TABLE
            // ========================================================

            def sonarTableRows = ''
            def sonarRowIndex = 0

            summary.each { project, d ->

                def shortName = project
                    .replace('AS_', '')
                    .split('-')
                    .collect { it.capitalize() }
                    .join(' ')

                def bugs     = (d.bugs             ?: 0) as Integer
                def vulns    = (d.vulnerabilities ?: 0) as Integer
                def smells   = (d.code_smells      ?: 0) as Integer
                def blocker  = (d.blocker          ?: 0) as Integer
                def critical = (d.critical         ?: 0) as Integer
                def major    = (d.major            ?: 0) as Integer
                def minor    = (d.minor            ?: 0) as Integer
                def info     = (d.info             ?: 0) as Integer
                def total    = (d.total_issues     ?: 0) as Integer

                def date = d.report_date ?: 'N/A'
                def hasErr = d.error ? ' ⚠' : ''

                def rowBg =
                    sonarRowIndex % 2 == 0
                        ? '#FFFFFF'
                        : '#F8FAFC'

                def bugClr =
                    bugs > 0 ? '#B91C1C' : '#15803D'

                def vulnClr =
                    vulns > 0 ? '#B91C1C' : '#15803D'

                def blockerClr =
                    blocker > 0 ? '#B91C1C' : '#6B7280'

                def criticalClr =
                    critical > 0 ? '#C2410C' : '#6B7280'

                def gateIcon =
                    (blocker > 0 || bugs > 0 || vulns > 0)
                        ? '🔴'
                        : (critical > 0 || major > 0)
                            ? '🟠'
                            : '🟢'

                sonarTableRows += """
                    <tr style="background:${rowBg};">

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;font-weight:500;color:#1E293B;white-space:nowrap;">
                            ${gateIcon} ${shortName}${hasErr}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${bugClr};font-weight:600;">
                            ${bugs}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${vulnClr};font-weight:600;">
                            ${vulns}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#7C3AED;">
                            ${smells}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${blockerClr};font-weight:${blocker > 0 ? '700' : '400'};">
                            ${blocker}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${criticalClr};font-weight:${critical > 0 ? '700' : '400'};">
                            ${critical}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#92400E;">
                            ${major}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#374151;">
                            ${minor}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#6B7280;">
                            ${info}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;font-weight:700;color:#0F172A;">
                            ${total}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#94A3B8;font-size:11px;">
                            ${date}
                        </td>

                    </tr>
                """

                sonarRowIndex++
            }


            // ========================================================
            // SONAR TOTAL ROW
            // ========================================================

            def sonarFooterRow = """
                <tr style="background:#0F172A;">

                    <td style="padding:12px 14px;color:#F1F5F9;font-weight:700;">
                        TOTALS
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalBugs > 0 ? '#FCA5A5' : '#86EFAC'};font-weight:700;">
                        ${totalBugs}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalVulns > 0 ? '#FCA5A5' : '#86EFAC'};font-weight:700;">
                        ${totalVulns}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#C4B5FD;font-weight:700;">
                        ${totalSmells}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalBlocker > 0 ? '#FCA5A5' : '#94A3B8'};font-weight:700;">
                        ${totalBlocker}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalCritical > 0 ? '#FED7AA' : '#94A3B8'};font-weight:700;">
                        ${totalCritical}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#FDE68A;font-weight:700;">
                        ${totalMajor}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#94A3B8;font-weight:700;">
                        ${totalMinor}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#94A3B8;font-weight:700;">
                        ${totalInfo}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#F1F5F9;font-weight:700;font-size:14px;">
                        ${totalIssues}
                    </td>

                    <td style="padding:12px 14px;color:#64748B;font-size:11px;">
                        all services
                    </td>

                </tr>
            """


            // ========================================================
            // GRYPE PER-SERVICE TABLE
            // ========================================================

            def securityTableRows = ''
            def securityRowIndex = 0

            securitySummary.each { service, d ->

                def displayName = service
                    .replace('_service', '')
                    .replace('_', ' ')
                    .split(' ')
                    .collect { it.capitalize() }
                    .join(' ')

                def components =
                    (d.components ?: 0) as Integer

                def critical =
                    (d.critical ?: 0) as Integer

                def high =
                    (d.high ?: 0) as Integer

                def medium =
                    (d.medium ?: 0) as Integer

                def low =
                    (d.low ?: 0) as Integer

                def negligible =
                    (d.negligible ?: 0) as Integer

                def unknown =
                    (d.unknown ?: 0) as Integer

                def total =
                    (d.total ?: 0) as Integer

                def jarName =
                    d.jar ?: d.jar_name ?: 'N/A'

                def rowBg =
                    securityRowIndex % 2 == 0
                        ? '#FFFFFF'
                        : '#F8FAFC'

                def securityIcon =
                    critical > 0
                        ? '🔴'
                        : high > 0
                            ? '🟠'
                            : medium > 0
                                ? '🟡'
                                : '🟢'

                securityTableRows += """
                    <tr style="background:${rowBg};">

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;font-weight:500;color:#1E293B;white-space:nowrap;">
                            ${securityIcon} ${displayName}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;color:#475569;font-size:11px;">
                            ${jarName}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#475569;">
                            ${components}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${critical > 0 ? '#B91C1C' : '#15803D'};font-weight:${critical > 0 ? '700' : '500'};">
                            ${critical}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${high > 0 ? '#C2410C' : '#15803D'};font-weight:${high > 0 ? '700' : '500'};">
                            ${high}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:${medium > 0 ? '#A16207' : '#15803D'};font-weight:${medium > 0 ? '600' : '500'};">
                            ${medium}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#64748B;">
                            ${low}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#94A3B8;">
                            ${negligible}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;color:#94A3B8;">
                            ${unknown}
                        </td>

                        <td style="padding:10px 14px;border-bottom:1px solid #E2E8F0;text-align:center;font-weight:800;color:#0F172A;">
                            ${total}
                        </td>

                    </tr>
                """

                securityRowIndex++
            }


            // ========================================================
            // GRYPE TOTAL ROW
            // ========================================================

            def securityFooterRow = """
                <tr style="background:#0F172A;">

                    <td colspan="2" style="padding:12px 14px;color:#F1F5F9;font-weight:700;">
                        SECURITY TOTALS
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#CBD5E1;font-weight:700;">
                        ${totalComponents}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalSecurityCritical > 0 ? '#FCA5A5' : '#86EFAC'};font-weight:700;">
                        ${totalSecurityCritical}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalSecurityHigh > 0 ? '#FED7AA' : '#86EFAC'};font-weight:700;">
                        ${totalSecurityHigh}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:${totalSecurityMedium > 0 ? '#FDE68A' : '#86EFAC'};font-weight:700;">
                        ${totalSecurityMedium}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#CBD5E1;font-weight:700;">
                        ${totalSecurityLow}
