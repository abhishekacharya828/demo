                            </div>
                        </td>

                        <td style="padding:9px 10px;border-bottom:1px solid #E2E8F0;color:#475569;">
                            ${installed}
                        </td>

                        <td style="padding:9px 10px;border-bottom:1px solid #E2E8F0;color:#15803D;font-weight:600;">
