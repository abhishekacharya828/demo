                        ${totalSecurityUnknown}
                    </td>

                    <td style="padding:12px 14px;text-align:center;color:#F8FAFC;font-weight:800;font-size:14px;">
                        ${totalSecurity}
                    </td>

                </tr>
            """


            // ========================================================
            // TOP GRYPE FINDINGS
            //
            // Read individual Grype JSON reports from the ZIP/workspace
            // if they are available after unstash.
            // ========================================================

            def topFindingsRows = ''

            sh '''
                rm -rf "${WORKSPACE}/security-email-reports"
                mkdir -p "${WORKSPACE}/security-email-reports"

                if [ -f "${WORKSPACE}/security-reports-all.zip" ]; then
                    unzip -o "${WORKSPACE}/security-reports-all.zip" \
                        -d "${WORKSPACE}/security-email-reports" >/dev/null 2>&1 || true
                fi
            '''

            def grypeFiles = sh(
                script: """
                    find "${WORKSPACE}/security-email-reports" \\
                        -type f \\
                        \\( -name '*-grype.json' -o -name '*vulnerabilities.json' \\) \\
                        | sort
                """,
                returnStdout: true
            ).trim()

            def findingList = []

            if (grypeFiles) {

                grypeFiles.split('\\n').each { filePath ->

                    try {

                        def grypeData = readJSON(
                            file: filePath
                        )

                        def serviceName =
                            new File(filePath)
                                .getName()
                                .replace('-grype.json', '')
                                .replace('-vulnerabilities.json', '')

                        def matches =
                            grypeData.matches ?: []

                        matches.each { finding ->

                            def vulnerability =
                                finding.vulnerability ?: [:]

                            def artifact =
                                finding.artifact ?: [:]

                            def severity =
                                (vulnerability.severity ?: 'Unknown')
                                    .toString()
                                    .toUpperCase()

                            if (
                                severity == 'CRITICAL' ||
                                severity == 'HIGH'
                            ) {

                                def cvssValue = ''

                                if (
                                    vulnerability.cvss &&
                                    vulnerability.cvss.size() > 0
                                ) {
                                    cvssValue =
                                        vulnerability.cvss[0]?.metrics?.baseScore ?:
                                        vulnerability.cvss[0]?.baseScore ?:
                                        ''
                                }

                                def fixedVersion = ''

                                if (
                                    finding.remediate &&
                                    finding.remediate.versions
                                ) {
                                    fixedVersion =
                                        finding.remediate.versions
                                            .join(', ')
                                }

                                if (!fixedVersion) {
                                    fixedVersion =
                                        vulnerability.fix?.versions
                                            ? vulnerability.fix.versions.join(', ')
                                            : 'Not available'
                                }

                                findingList << [
                                    severity: severity,
                                    packageName: artifact.name ?: 'Unknown',
                                    installed: artifact.version ?: 'Unknown',
                                    fixed: fixedVersion,
                                    cvss: cvssValue ?: 'N/A',
                                    service: serviceName,
                                    id: vulnerability.id ?: 'N/A'
                                ]
                            }
                        }

                    } catch (Exception e) {

                        echo "Unable to parse Grype file ${filePath}: ${e.message}"
                    }
                }
            }


            // Sort Critical first, then High
            findingList.sort { a, b ->

                def severityOrder = [
                    'CRITICAL': 0,
                    'HIGH': 1
                ]

                severityOrder[a.severity] <=> severityOrder[b.severity]
            }


            // Show maximum 15 findings
            findingList.take(15).eachWithIndex { finding, index ->

                def sev = finding.severity

                def sevColor =
                    sev == 'CRITICAL'
                        ? '#B91C1C'
                        : '#C2410C'

                def sevBg =
                    sev == 'CRITICAL'
                        ? '#FEF2F2'
                        : '#FFF7ED'

                def packageName = finding.packageName
                def installed = finding.installed
                def fixed = finding.fixed
                def cvss = finding.cvss
                def service = finding.service
                def vulnId = finding.id

